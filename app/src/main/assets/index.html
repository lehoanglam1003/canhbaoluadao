<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo - Trợ Lý An Toàn AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --zalo-blue: #0068FF; --bg-gray: #F4F6F9; --danger-color: #DC2626; --safe-color: #166534; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #1E293B; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .mobile-frame { width: 100%; max-width: 440px; height: 100vh; background: var(--bg-gray); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .zalo-header { background: linear-gradient(135deg, #0068FF, #0043A8); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; }
        .header-btns { display: flex; gap: 8px; }
        .sos-btn { background: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .report-btn { background: #EAB308; color: white; border: none; padding: 6px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }

        .chat-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 92%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; position: relative; }
        .bot-msg { background-color: white; align-self: flex-start; color: #1E293B; border: 1px solid #E2E8F0; }
        .user-msg { background-color: #0068FF; color: white; align-self: flex-end; }

        .alert-card { border-radius: 10px; padding: 12px; margin-top: 6px; font-size: 13px; position: relative; }
        .alert-danger { background: #FEF2F2; color: #991B1B; border: 1px solid #FCA5A5; }
        .alert-safe { background: #F0FDF4; color: #166534; border: 1px solid #86EFAC; }

        .risk-meter { height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .risk-fill { height: 100%; transition: width 0.5s ease; }

        .action-bar { display: flex; gap: 12px; margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 8px; }
        .action-btn { background: transparent; border: none; color: #475569; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .action-btn:hover { color: var(--zalo-blue); }

        .controls-bar { background: white; padding: 8px 12px; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mic-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #64748B; color: white; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .mic-btn.recording { background: var(--danger-color); animation: pulse 1s infinite; }
        .ocr-btn { background: #475569; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .input-area { background: white; padding: 10px 12px; border-top: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 8px; }
        textarea { width: 100%; height: 50px; padding: 8px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 13px; resize: none; outline: none; }
        .send-btn { background: var(--zalo-blue); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="zalo-header">
        <div class="header-title">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Trợ Lý An Toàn AI</span>
        </div>
        <div class="header-btns">
            <button class="report-btn" onclick="reportScam()"><i class="fa-solid fa-flag"></i> Báo cáo</button>
            <button class="sos-btn" onclick="alert('🚨 Đã gửi tín hiệu SOS tới danh bạ khẩn cấp!')">SOS</button>
        </div>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message bot-msg">
            <b><i class="fa-solid fa-user-ninja"></i> Đặc vụ An ninh AI:</b> Xin chào! Tôi là Chuyên gia AI Phòng chống Lừa đảo & Thao túng Tâm lý. Hãy nhập tin nhắn, tải ảnh chụp hoặc dùng giọng nói để tôi phân tích giúp bạn!
        </div>
    </div>

    <div class="controls-bar">
        <button id="micBtn" class="mic-btn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImage(event)">
        <button class="ocr-btn" onclick="document.getElementById('imageInput').click()"><i class="fa-solid fa-camera"></i> Quét ảnh</button>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Nhập tin nhắn, đường link nghi ngờ hoặc thu âm..."></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-magnifying-glass"></i> KIỂM TRA NGAY</button>
    </div>
</div>

<script>
    const GEMINI_API_KEY = "AIzaSyDncH9shvUk67SjDGi7CwK4Nvi7uQAqeTQ";

    let recognition = null;
    let isRecording = false;

    // Khởi tạo Nhận diện Giọng nói (Speech-to-Text)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.continuous = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            toggleMic();
            sendMessage();
        };

        recognition.onerror = () => toggleMic();
        recognition.onend = () => { if(isRecording) toggleMic(); };
    }

    function toggleMic() {
        if (!recognition) {
            alert("Trình duyệt không hỗ trợ nhận diện giọng nói!");
            return;
        }
        const micBtn = document.getElementById('micBtn');
        if (!isRecording) {
            recognition.start();
            isRecording = true;
            micBtn.classList.add('recording');
        } else {
            recognition.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
        }
    }

    // Đọc văn bản thành tiếng (Text-to-Speech)
    function speakText(text) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#🚨🧠🛡️📞]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        const chatBody = document.getElementById('chatBody');
        chatBody.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chatBody.innerHTML += `<div class="message bot-msg" id="${loadingId}"><i>🤖 Hệ thống Chuyên gia AI đang phân tích thủ đoạn & đòn thao túng...</i></div>`;
        chatBody.scrollTop = chatBody.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `[VAI TRÒ VÀ TƯ DUY NỀN TẢNG]
Bạn là Hệ thống Chuyên gia AI Cao cấp về Phòng chống Tội phạm Công nghệ cao và Thao túng Tâm lý, hoạt động với sự kết hợp của 3 vai trò:
1. ĐẶC VỤ BỘ CÔNG AN / ĐIỀU TRA VIÊN: Nhận diện chính xác kịch bản lừa đảo, dấu hiệu giả mạo cơ quan nhà nước (Công an, BHXH, Y tế, Ngân hàng), nhận diện các phương thức công nghệ độc hại (Deepfake, Voice Cloning, link APK, Brandname giả).
2. BÁC SĨ TÂM LÝ TỘI PHẠM: Giải mã các đòn thao túng tâm lý độc hại (kích hoạt vùng amygdala gây hoảng loạn, đánh vào bản năng bảo vệ con cháu, khai thác "khoảng trống cảm xúc" sự cô đơn, bẫy lòng tham/sức khỏe), giúp xoa dịu tâm lý hoảng hỏng của nạn nhân.
3. CHUYÊN GIA TRUYỀN THÔNG VÀ TƯ VẤN GIA ĐÌNH: Đưa ra giải pháp phòng vệ ngắn gọn, dứt khoát, dễ hiểu đối với người cao tuổi và hướng dẫn con cháu cách ứng xử văn minh.

[NHIỆM VỤ CHÍNH]
Khi nhận được bất kỳ thông tin nào từ người dùng (kịch bản cuộc gọi, tin nhắn, hình ảnh, đường link, hoặc câu chuyện hoảng loạn của nạn nhân):
1. Đánh giá Mức độ Rủi ro (Scale 0 - 100%).
2. Giải mã Chiêu trò & Bẫy Tâm lý độc hại.
3. Cung cấp Phác đồ Kỹ thuật "3 phút im lặng" & Hành động Khẩn cấp.
4. Đưa ra Kịch bản Ứng phó / Lời khuyên cho Gia đình.

[QUY TRÌNH PHÂN TÍCH VÀ ĐÁNH GIÁ (BẮT BUỘC)]

Bước 1: NHẬN DIỆN MỨC ĐỘ RỦI RO
- AN TOÀN (0% - 20%): Thông tin chuẩn mực, không có yếu tố hối thúc hay đòi hỏi tài chính/OTP.
- CẦN THẬN TRỌNG / NGHỜ VẤN (30% - 60%): Cuộc gọi/tin nhắn từ số lạ, lời mời nhận quà 0đ, hội thảo mồi, yêu cầu cập nhật VNeID/BHXH.
- BÁO ĐỘNG ĐỎ / NGUY HIỂM CỰC CAO (70% - 100%): Yêu cầu CHUYỂN TIỀN VÀO TÀI KHOẢN CÁ NHÂN, đọc OTP, dọa bắt giam/án tụng, báo tin con cháu cấp cứu, yêu cầu tải file APK hoặc bấm link lạ.

Bước 2: BÓC TÁCH ĐÒN THAO TÚNG TÂM LÝ & KỊCH BẢN TỘI PHẠM
Chỉ ra chính xác "vũ khí tâm lý" đối phương đang dùng:
- Thao túng Quyền lực & Nỗi sợ: Giả danh Công an/VKS/BHXH, dọa rửa tiền, khóa thẻ, yêu cầu vào phòng kín cô lập.
- Khai thác Tình thân & AI Deepfake: Giả giọng/hình ảnh con cháu bị tai nạn nguy cấp, chủ động làm tín hiệu "giật lag/mạng yếu" để che giấu lỗi AI.
- Bẫy Tình cảm & Tặng quà (Romance Scam): Nhắn tin chăm sóc hàng ngày giải tỏa cô đơn, sau đó bắt nộp "phí thông quan/phí phạt".
- Đánh vào Nhu cầu Sức khỏe & Lòng tham: Cò mồi hội thảo "thần dược", báo trúng thưởng bắt nộp thuế trước.

Bước 3: PHÁC ĐỒ PHÒNG NGỪA KHẨN CẤP (QUY TẮC "3 KHÔNG - 3 PHÚT IM LẶNG")
- Kỹ thuật "3 phút im lặng": Yêu cầu người dùng dừng lại 3 phút, hít thở sâu, hoặc đặt 1 câu hỏi bí mật gia đình để kích hoạt lại vùng vỏ não tiền trán (thoát trạng thái hoảng loạn do amygdala bị kích thích).
- Thực hành "3 KHÔNG": KHÔNG TIN (Tắt máy/ngắt kết nối) - KHÔNG SỢ (Cơ quan nhà nước không làm việc qua điện thoại) - KHÔNG CHUYỂN TIỀN (Vào bất kỳ tài khoản cá nhân nào).

[ĐỊNH DẠNG ĐẦU RA (OUTPUT FORMAT)]
Nội dung phản hồi PHẢI trình bày mạch lạc, rõ ràng, giàu tính hành động:
🚨 1. ĐÁNH GIÁ MỨC ĐỘ RỦI RO: [X%] - [CẢNH BÁO ĐỎ / NGHỜ VẤN / AN TOÀN]

🧠 2. MÃ HÓA THỦ ĐOẠN & BẪY TÂM LÝ:
- Kịch bản lừa đảo: (Mô tả thủ đoạn đối phương đang dùng)
- Đòn thao túng tâm lý: (Chỉ ra cơ chế gây sợ hãi/gấp gáp/đánh vào tình thân)

🛡️ 3. HÀNH ĐỘNG KHẨN CẤP (PHÁC ĐỒ "3 KHÔNG"):
- [Kỹ thuật 3 phút im lặng / Tắt máy ngay lập tức]
- [Tuyệt đối KHÔNG đọc OTP / KHÔNG chuyển tiền vào tài khoản cá nhân]
- [Gọi lại xác minh qua SĐT thường dùng của người thân hoặc đường dây nóng]

📞 4. KÊNH THÔNG TIN CHÍNH THỐNG & KỊCH BẢN ỨNG PHÓ:
- Lời đáp trả/Cắt đuôi an toàn: (Mẫu câu ngắn để cúp máy ngay)
- Đường dây nóng hỗ trợ:
  + Tổng đài BHXH Việt Nam: 1900.9068 (Khi gặp sự cố BHXH/BHYT)
  + Công an Xã/Phường địa phương hoặc Hotline An ninh mạng.
- Lời khuyên cho Con Cháu (nếu có): (Cài xác thực sinh trắc học, đặt mật mã gia đình, an ủi tránh trách móc nạn nhân).

[TONE & STYLE]
- Nghiêm túc, đĩnh đạc, bản lĩnh (như Đặc vụ điều tra).
- Thấu hiểu, điềm tĩnh, trấn an mạnh mẽ (như Bác sĩ tâm lý).
- Ngôn từ trực diện, rõ ràng, dễ đọc với người cao tuổi, prioritize dùng biểu tượng trực quan.

---
DƯỚI ĐÂY LÀ THÔNG TIN TỪ NGƯỜI DÙNG CẦN PHÂN TÍCH:
"${text}"`
                        }]
                    }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const rawText = data.candidates[0].content.parts[0].text;

                // Trích xuất điểm rủi ro
                const scoreMatch = rawText.match(/(\d+)%/);
                const score = scoreMatch ? parseInt(scoreMatch[1]) : (rawText.includes("BÁO ĐỘNG ĐỎ") || rawText.includes("CẢNH BÁO ĐỎ") ? 90 : 15);

                let alertClass = score >= 50 ? 'alert-danger' : 'alert-safe';
                let fillColor = score >= 50 ? '#DC2626' : '#166534';

                const alertBox = `
                    <div class="alert-card ${alertClass}">
                        <b>MỨC ĐỘ RỦI RO HỆ THỐNG ĐÁNH GIÁ: ${score}%</b>
                        <div class="risk-meter"><div class="risk-fill" style="width: ${score}%; background: ${fillColor};"></div></div>
                        ${rawText.replace(/\n/g, '<br>')}
                        <div class="action-bar">
                            <button class="action-btn" onclick="speakText(\`${rawText.replace(/[`"'\\]/g, '')}\`)"><i class="fa-solid fa-volume-high"></i> Nghe đọc</button>
                            <button class="action-btn" onclick="navigator.clipboard.writeText(\`${rawText.replace(/[`"'\\]/g, '')}\`); alert('Đã sao chép báo cáo cảnh báo!');"><i class="fa-solid fa-share-nodes"></i> Chia sẻ</button>
                        </div>
                    </div>`;

                document.getElementById(loadingId).innerHTML = alertBox;
                saveHistory(text, score);
                speakText(rawText);
            }
        } catch (error) {
            console.error(error);
            document.getElementById(loadingId).innerHTML = `<div class="alert-card alert-danger">❌ Lỗi kết nối AI hoặc API Key không khả dụng!</div>`;
        }
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function processImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const inputArea = document.getElementById('userInput');
        inputArea.value = "⏳ Đang quét bóc tách chữ từ hình ảnh...";

        try {
            const result = await Tesseract.recognize(file, 'vie');
            inputArea.value = result.data.text.trim();
        } catch (err) {
            inputArea.value = "";
            alert("❌ Không thể trích xuất chữ từ ảnh này!");
        }
    }

    function saveHistory(msg, score) {
        let history = JSON.parse(localStorage.getItem('scam_history') || '[]');
        history.push({ msg, score, time: new Date().toLocaleTimeString() });
        localStorage.setItem('scam_history', JSON.stringify(history));
    }

    function reportScam() {
        const phone = prompt("Nhập số điện thoại/Tài khoản ngân hàng lừa đảo:");
        if (phone) alert(`✅ Đã ghi nhận báo cáo đối tượng [${phone}] gửi về Cơ quan An ninh mạng!`);
    }
</script>
</body>
</html>
