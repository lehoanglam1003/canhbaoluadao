<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo - Trợ Lý An Toàn AI (Tốc Độ Siêu Tốc)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --zalo-blue: #0068FF; --bg-gray: #F4F6F9; --danger-color: #DC2626; --safe-color: #166534; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #1E293B; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .mobile-frame { width: 100%; max-width: 440px; height: 100vh; background: var(--bg-gray); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .zalo-header { background: linear-gradient(135deg, #0068FF, #0043A8); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; }
        .header-btns { display: flex; gap: 8px; }
        .sos-btn { background: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .report-btn { background: #EAB308; color: white; border: none; padding: 6px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }

        .chat-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 92%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; position: relative; }
        .bot-msg { background-color: white; align-self: flex-start; color: #1E293B; border: 1px solid #E2E8F0; }
        .user-msg { background-color: #0068FF; color: white; align-self: flex-end; }
        .preview-img { max-width: 100%; border-radius: 8px; margin-bottom: 6px; }

        .alert-card { border-radius: 10px; padding: 12px; margin-top: 6px; font-size: 13px; position: relative; }
        .alert-danger { background: #FEF2F2; color: #991B1B; border: 1px solid #FCA5A5; }
        .alert-safe { background: #F0FDF4; color: #166534; border: 1px solid #86EFAC; }
        .alert-instant { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; font-weight: bold; margin-bottom: 8px; }

        .risk-meter { height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .risk-fill { height: 100%; transition: width 0.3s ease; }

        .action-bar { display: flex; gap: 12px; margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 8px; }
        .action-btn { background: transparent; border: none; color: #475569; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .controls-bar { background: white; padding: 8px 12px; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mic-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #64748B; color: white; font-size: 16px; cursor: pointer; }
        .mic-btn.recording { background: var(--danger-color); animation: pulse 1s infinite; }
        .ocr-btn { background: #059669; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .input-area { background: white; padding: 10px 12px; border-top: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 8px; }
        textarea { width: 100%; height: 50px; padding: 8px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 13px; resize: none; outline: none; }
        .send-btn { background: var(--zalo-blue); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="zalo-header">
        <div class="header-title">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Trợ Lý An Toàn AI</span>
        </div>
        <div class="header-btns">
            <button class="report-btn" onclick="reportScam()"><i class="fa-solid fa-flag"></i> Báo cáo</button>
            <button class="sos-btn" onclick="alert('🚨 Đã gửi tín hiệu SOS!')">SOS</button>
        </div>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message bot-msg">
            <b><i class="fa-solid fa-bolt"></i> AI An Ninh (Cảnh báo 100ms):</b> Tải ảnh hoặc nhập tin nhắn để kiểm tra lập tức!
        </div>
    </div>

    <div class="controls-bar">
        <button id="micBtn" class="mic-btn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        <button class="ocr-btn" onclick="document.getElementById('imageInput').click()"><i class="fa-solid fa-bolt"></i> Quét Ảnh Cấp Tốc</button>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Nhập tin nhắn hoặc chọn ảnh..."></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-magnifying-glass"></i> PHÂN TÍCH</button>
    </div>
</div>

<script>
    const GEMINI_API_KEY = "AIzaSyDncH9shvUk67SjDGi7CwK4Nvi7uQAqeTQ";
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.onresult = (event) => {
            document.getElementById('userInput').value = event.results[0][0].transcript;
            toggleMic();
            sendMessage();
        };
    }

    function toggleMic() {
        if (!recognition) return alert("Trình duyệt không hỗ trợ mic!");
        const micBtn = document.getElementById('micBtn');
        if (!isRecording) { recognition.start(); isRecording = true; micBtn.classList.add('recording'); }
        else { recognition.stop(); isRecording = false; micBtn.classList.remove('recording'); }
    }

    function speakText(text) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#🚨🧠🛡️📞]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'vi-VN';
        window.speechSynthesis.speak(utterance);
    }

    // TẦNG 1: NGUYÊN TẮC LỌC SIÊU TỐC HẠN CHẾ ĐỘ TRỄ (Chạy trong 10-50ms)
    function quickScanText(text) {
        const scamKeywords = ['biên lai', 'chưa nộp phạt', 'bộ giao thông', 'bo gtvt', 'yêu cầu', 'liên hệ', 'khóa sim', 'vneid', 'công an', 'thông báo cuối cùng'];
        let matched = scamKeywords.filter(kw => text.toLowerCase().includes(kw));
        if (matched.length >= 2) {
            return {
                risk: 95,
                warning: "🚨 CẢNH BÁO ĐỎ CẤP TỐC (10ms): Phát hiện dấu hiệu Giả mạo Cơ quan Nhà nước / Phạt nguội lừa đảo!"
            };
        }
        return null;
    }

    // HÀM TỐI ƯU/NÉN ẢNH SIÊU TỐC ĐỂ GIẢM BĂNG THÔNG NỘP API
    function compressImage(file, maxWidth = 600, quality = 0.6) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            };
        });
    }

    const SHORT_PROMPT = `Bạn là Chuyên gia An ninh AI. Hãy phân tích ngắn gọn trong 3 câu:
🚨 1. RỦI RO: [X%] - CẢNH BÁO
🧠 2. BẪY LỪA ĐẢO: (Tóm tắt trong 1 câu)
🛡️ 3. HÀNH ĐỘNG: (Tắt máy/Cúp liên lạc, không gọi lại SĐT trên tin nhắn, gọi 1900.9068 hoặc Công an)`;

    async function sendMessage(base64Image = null) {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text && !base64Image) return;

        const chatBody = document.getElementById('chatBody');
        const startTime = performance.now();

        // 1. Hiển thị UI người dùng ngay lập tức
        let userContent = text;
        if (base64Image) {
            userContent = `<img src="${base64Image}" class="preview-img"><br>` + (text || "Phân tích ảnh này giúp tôi!");
        }
        chatBody.innerHTML += `<div class="message user-msg">${userContent}</div>`;
        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        const loadingId = 'loading-' + Date.now();

        // TẦNG 1: QUÉT TRỰC TIẾP TRÊN LOCAL (< 50ms)
        const instantResult = text ? quickScanText(text) : null;
        let instantHtml = "";
        if (instantResult) {
            instantHtml = `<div class="alert-card alert-instant">${instantResult.warning}</div>`;
        }

        chatBody.innerHTML += `<div class="message bot-msg" id="${loadingId}">
            ${instantHtml}
            <i>⚡ Đang gửi dữ liệu nén đến AI Cloud để bóc tách chuyên sâu...</i>
        </div>`;
        chatBody.scrollTop = chatBody.scrollHeight;

        // TẦNG 2: GỬI LÊN GEMINI CLOUD NÉN
        let parts = [{ text: SHORT_PROMPT + "\nNội dung: " + text }];
        if (base64Image) {
            parts.unshift({
                inline_data: {
                    mime_type: "image/jpeg",
                    data: base64Image.split(',')[1]
                }
            });
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: parts }] })
            });

            const data = await response.json();
            const endTime = performance.now();
            const processTime = Math.round(endTime - startTime);

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const rawText = data.candidates[0].content.parts[0].text;
                const scoreMatch = rawText.match(/(\d+)%/);
                const score = scoreMatch ? parseInt(scoreMatch[1]) : 90;

                let alertClass = score >= 50 ? 'alert-danger' : 'alert-safe';
                let fillColor = score >= 50 ? '#DC2626' : '#166534';

                const alertBox = `
                    <div class="alert-card ${alertClass}">
                        ${instantHtml}
                        <b>MỨC ĐỘ RỦI RO: ${score}%</b> (Phản hồi trong: ${processTime}ms)
                        <div class="risk-meter"><div class="risk-fill" style="width: ${score}%; background: ${fillColor};"></div></div>
                        ${rawText.replace(/\n/g, '<br>')}
                        <div class="action-bar">
                            <button class="action-btn" onclick="speakText(\`${rawText.replace(/[`"'\\]/g, '')}\`)"><i class="fa-solid fa-volume-high"></i> Nghe đọc</button>
                        </div>
                    </div>`;

                document.getElementById(loadingId).innerHTML = alertBox;
                speakText(rawText);
            }
        } catch (error) {
            document.getElementById(loadingId).innerHTML = `<div class="alert-card alert-danger">❌ Lỗi kết nối AI!</div>`;
        }
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Nén ảnh cực nhanh trước khi nộp
        const compressedBase64 = await compressImage(file, 600, 0.6);
        sendMessage(compressedBase64);
    }

    function reportScam() {
        const phone = prompt("Nhập số lừa đảo:");
        if (phone) alert(`✅ Đã báo cáo [${phone}]!`);
    }
</script>
</body>
</html>
