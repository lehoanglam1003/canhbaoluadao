<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo - Trợ Lý An Toàn AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --zalo-blue: #0068FF; --bg-gray: #F4F6F9; --danger-color: #DC2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #1E293B; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .mobile-frame { width: 100%; max-width: 440px; height: 100vh; background: var(--bg-gray); display: flex; flex-direction: column; overflow: hidden; }
        .zalo-header { background: linear-gradient(135deg, #0068FF, #0043A8); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; }
        .sos-btn { background: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .chat-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 90%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
        .bot-msg { background-color: white; align-self: flex-start; color: #1E293B; border: 1px solid #E2E8F0; }
        .user-msg { background-color: #0068FF; color: white; align-self: flex-end; }
        .alert-card { border-radius: 10px; padding: 10px 12px; margin-top: 6px; font-size: 13px; }
        .alert-danger { background: #FEF2F2; color: #991B1B; border: 1px solid #FCA5A5; }
        .alert-safe { background: #F0FDF4; color: #166534; border: 1px solid #86EFAC; }
        .controls-bar { background: white; padding: 8px 12px; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mic-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #64748B; color: white; font-size: 16px; cursor: pointer; }
        .ocr-btn { background: #475569; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .testcase-select { padding: 6px; border-radius: 6px; border: 1px solid #CBD5E1; font-size: 12px; max-width: 130px; }
        .input-area { background: white; padding: 10px 12px; border-top: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 8px; }
        textarea { width: 100%; height: 50px; padding: 8px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 13px; resize: none; outline: none; }
        .send-btn { background: var(--zalo-blue); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="mobile-frame">
    <div class="zalo-header">
        <div class="header-title">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Trợ Lý An Toàn AI</span>
        </div>
        <button class="sos-btn" onclick="alert('🚨 Đã gửi tín hiệu SOS!')">SOS</button>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message bot-msg">
            <b><i class="fa-solid fa-robot"></i> Trợ lý AI:</b> Xin chào! Hãy dán tin nhắn, chụp ảnh hoặc chọn mẫu để kiểm tra lừa đảo.
        </div>
    </div>

    <div class="controls-bar">
        <button id="micBtn" class="mic-btn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImage(event)">
        <button class="ocr-btn" onclick="document.getElementById('imageInput').click()"><i class="fa-solid fa-camera"></i> Quét ảnh</button>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Nhập nội dung nghi vấn..."></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-magnifying-glass"></i> KIỂM TRA NGAY</button>
    </div>
</div>

<script>

    // 1. Dán API Key Gemini của bạn vào giữa hai dấu ngoặc kép bên dưới
     const GEMINI_API_KEY = "AIzaSyDncH9shvUk67SjDGi7CwK4Nvi7uQAqeTQ";

     // 2. Hàm sendMessage đã được nâng cấp kết nối Gemini API
     async function sendMessage() {
         const input = document.getElementById('userInput');
         const text = input.value.trim();
         if (!text) return;

         const chatBody = document.getElementById('chatBody');

         // Hiển thị tin nhắn người dùng vừa gửi
         chatBody.innerHTML += `<div class="message user-msg">${text}</div>`;
         input.value = '';
         chatBody.scrollTop = chatBody.scrollHeight;

         // Hiển thị bong bóng thông báo AI đang phân tích
         const loadingId = 'loading-' + Date.now();
         chatBody.innerHTML += `<div class="message bot-msg" id="${loadingId}"><i>🤖 Trợ lý AI đang phân tích nội dung...</i></div>`;
         chatBody.scrollTop = chatBody.scrollHeight;

         try {
             // Gọi Gemini 1.5 Flash API
             const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                 method: 'POST',
                 headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify({
                     contents: [{
                         parts: [{
                             text: `Bạn là Trợ Lý An Toàn AI giúp người dân phát hiện lừa đảo qua tin nhắn/cuộc gọi.
 Hãy phân tích đoạn nội dung sau: "${text}"

 Yêu cầu phản hồi ngắn gọn, rõ ràng:
 1. Đánh giá mức độ: [AN TOÀN / NGHI VẤN / LỪA ĐẢO NGUY HIỂM]
 2. Dấu hiệu nghi vấn (nếu có, tóm tắt 2-3 dòng)
 3. Lời khuyên xử lý cho người dùng.`
                         }]
                     }]
                 })
             });

             const data = await response.json();

             if (data.candidates && data.candidates[0].content.parts[0].text) {
                 const aiResponse = data.candidates[0].content.parts[0].text;

                 // Xác định màu khung cảnh báo (Đỏ nếu nguy hiểm/nghi vấn, Xanh nếu an toàn)
                 let alertClass = 'alert-safe';
                 if (aiResponse.includes("LỪA ĐẢO") || aiResponse.includes("NGHI VẤN") || aiResponse.includes("NGUY HIỂM")) {
                     alertClass = 'alert-danger';
                 }

                 const alertBox = `<div class="alert-card ${alertClass}"><b>KẾT QUẢ PHÂN TÍCH AI:</b><br>${aiResponse.replace(/\n/g, '<br>')}</div>`;
                 document.getElementById(loadingId).innerHTML = alertBox;
             } else {
                 document.getElementById(loadingId).innerHTML = `<div class="alert-card alert-danger">⚠️ Không nhận được phản hồi từ AI. Vui lòng kiểm tra lại API Key!</div>`;
             }

         } catch (error) {
             console.error("Lỗi Gemini API:", error);
             document.getElementById(loadingId).innerHTML = `<div class="alert-card alert-danger">❌ Lỗi kết nối mạng hoặc API Key không hợp lệ!</div>`;
         }

         chatBody.scrollTop = chatBody.scrollHeight;
     }

     function toggleMic() {
         alert("Tính năng thu âm đang kết nối...");
     }

     async function processImage(e) {
         const file = e.target.files[0];
         if (!file) return;

         const inputArea = document.getElementById('userInput');
         inputArea.value = "⏳ Đang quét và bóc tách chữ từ ảnh, vui lòng đợi giây lát...";

         try {
             const result = await Tesseract.recognize(
                 file,
                 'vie',
                 { logger: m => console.log(m) }
             );

             const extractedText = result.data.text.trim();

             if (extractedText) {
                 inputArea.value = extractedText;
             } else {
                 inputArea.value = "";
                 alert("❌ Không tìm thấy văn bản trong ảnh!");
             }
         } catch (error) {
             console.error("Lỗi OCR:", error);
             inputArea.value = "";
             alert("⚠️ Có lỗi xảy ra trong quá trình xử lý ảnh!");
         }
     }
</script>
</body>
</html>
